<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe from Hound emails</title>
<meta name="description" content="Stop emails from Hound.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="15.2" r="4.1" fill="#9184d9"/>
        <circle cx="5.1" cy="9.4" r="2.1" fill="#9184d9"/>
        <circle cx="18.9" cy="9.4" r="2.1" fill="#9184d9"/>
        <circle cx="8.3" cy="4.6" r="2" fill="#9184d9"/>
        <circle cx="15.7" cy="4.6" r="2" fill="#9184d9"/>
      </svg>
    </div>
    <div class="brand-name">Hound</div>
  </header>

  <div class="card">
    <h2 class="section-title">Stop Hound emails</h2>
    <p class="section-sub" id="unsub-sub">Press the button and Hound won't email this address again: no reminders, alerts or invites.</p>
    <button class="btn btn-primary btn-block" type="button" id="unsub-button">Stop Hound emails</button>
    <p class="form-note" id="unsub-note"></p>
    <p class="form-note">Changed your mind later? Turn email back on in the Hound app, under Settings.</p>
  </div>

</div>

<script src="/config.js"></script>
<script src="/unsubscribe.js"></script>
</body>
</html>
