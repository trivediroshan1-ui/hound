# Checks every pull request, and deploys master to the staging Supabase
# project once all checks pass. See mobile/supabase/STAGING.md.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Every job only reads the code. A job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .

  functions:
    name: Edge functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        working-directory: mobile/supabase/functions
        # The app's package.json next door is not the functions' dependency list.
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno check */index.ts

  site:
    name: Website syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in site/*.js app.js; do node --check "$f"; done

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration to a fresh database
        run: mobile/supabase/tests/setup-db.sh
      - name: Run database tests
        run: PSQL="docker exec -i hounddb psql -U postgres" mobile/supabase/tests/run.sh

  deploy-staging:
    name: Deploy to staging
    needs: [app, functions, site, database]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    # Its secrets can live in the "staging" environment (Settings >
    # Environments), limited to master, so no other branch can read them.
    environment: staging
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_REF: quglaamzzhebqrlhvfuc
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Check the staging secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and STAGING_DB_PASSWORD under Settings > Secrets and variables > Actions. See mobile/supabase/STAGING.md."
            exit 1
          fi
      # A fixed version, so a new CLI release can't change how staging is
      # deployed without a PR. Raise it on purpose.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "$STAGING_PROJECT_REF"
      - name: Apply new migrations
        run: supabase db push --include-all
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$STAGING_PROJECT_REF"
