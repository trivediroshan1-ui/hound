# Only the settings that need to differ from Supabase CLI's defaults live
# here — everything else (api/db/studio/auth ports, etc.) is left
# unspecified and just uses the CLI's own defaults.
#
# revenuecat-webhook is called by RevenueCat's own servers, not by this
# app's Supabase client — it sends its own custom `Authorization: Bearer
# <REVENUECAT_WEBHOOK_SECRET>` header (checked inside the function itself),
# never a Supabase JWT. Every delivery was getting rejected before it even
# reached the function's own code, by Supabase's platform-level default
# that requires a valid Supabase JWT on every Edge Function request
# (`UNAUTHORIZED_INVALID_JWT_FORMAT`) — this turns that default off for
# this one function only. sync-purchase is deliberately NOT listed here:
# it's called by this app's own signed-in users via the Supabase client
# SDK, which does send a real user JWT, so the default is exactly right
# there and re-verifies the caller inside the function too.
[functions.revenuecat-webhook]
verify_jwt = false

# admob-reward is called by Google's servers (AdMob server-side
# verification), which send no Supabase JWT; it checks Google's own
# signature inside the function instead (0114_rewarded_ads.sql).
[functions.admob-reward]
verify_jwt = false

# email-unsubscribe is opened from the link in an email, or POSTed by the
# mail app for one-click unsubscribe, with no Supabase sign-in. It checks
# the link's own signature instead (EMAIL_UNSUBSCRIBE_SECRET).
[functions.email-unsubscribe]
verify_jwt = false
